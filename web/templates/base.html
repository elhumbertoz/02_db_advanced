<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bases de Datos Avanzado{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-database-fill me-2"></i>ecommerce_db
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/consulta/1' %}active{% endif %}" href="/consulta/1">
            <i class="bi bi-table me-1"></i>2.1 Todos los pedidos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/consulta/2' %}active{% endif %}" href="/consulta/2">
            <i class="bi bi-calculator me-1"></i>2.2 Totales
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/consulta/3' %}active{% endif %}" href="/consulta/3">
            <i class="bi bi-exclamation-triangle me-1"></i>2.3 Sin confirmar
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted py-3 small border-top">
  Trabajo Final · Bases de Datos Avanzado B · Humberto Zambrano Carreño · CEU Felipe Villanueva
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
